name: CI

on:
  workflow_dispatch:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  release-hygiene:
    name: Local files and Git history
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python scripts/check_release.py --index --history

  contracts:
    name: Specification and quality baseline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: server/requirements-dev.lock
      - run: python -m pip install -c server/requirements-dev.lock -e "./server[dev]"
      - run: python scripts/check_spec_sync.py
      - run: python scripts/evaluate_quality.py --output .checks/quality.json
      - run: python scripts/export_spec_jsonschema.py --output .checks/schemas
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quality-and-contracts
          path: |
            .checks/quality.json
            .checks/schemas/
          include-hidden-files: true
          if-no-files-found: error

  lint:
    name: Strict backend checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -c server/requirements-dev.lock -e "./server[dev]"
      - run: python -m ruff check server/src
      - run: python -m ruff format --check server/src
      - run: python -m mypy server/src --config-file server/pyproject.toml --platform linux
      - run: python -m mypy server/src --config-file server/pyproject.toml --platform win32

  backend:
    name: Backend (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      NOVELWB_LLM_ADAPTER: mock
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -c server/requirements-dev.lock -e "./server[dev]"
      - run: python -m pytest server/tests -q -o verbosity_assertions=2
      - run: python -m pytest scripts/tests -q
      - run: python scripts/smoke_run.py

  frontend:
    name: Frontend typecheck, regression and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: webui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: webui/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: static-ui
          path: server/src/novelwb/web/

  package:
    name: Installable package and bundled UI
    runs-on: ubuntu-latest
    needs: [release-hygiene, contracts, lint, backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@v4
        with:
          name: static-ui
          path: server/src/novelwb/web/
      - run: python -m pip install -c server/requirements-dev.lock -e "./server[dev]"
      - run: python -m pip wheel --no-deps --wheel-dir .checks/wheels ./server
      - run: python scripts/check_package.py
      - uses: actions/upload-artifact@v4
        with:
          name: novelwb-wheel
          path: .checks/wheels/*.whl
          include-hidden-files: true
          if-no-files-found: error

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "novelwb"
version = "1.0.0"
description = "Human-reviewed LLM workflows and versioned story assets for long-form fiction"
readme = "README.md"
license = {file = "LICENSE"}
authors = [{name = "NewbieonfireSpongeforknowledge"}]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111",
    "uvicorn>=0.29",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "typer>=0.12",
    "jinja2>=3.1",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "aiosqlite>=0.20",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.4",
    "mypy>=1.10",
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "types-pyyaml",
]

[project.scripts]
novelwb = "novelwb.cli.main:main"

[tool.setuptools]
license-files = ["LICENSE"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
novelwb = ["core/*.yaml", "core/step_specs/*.yaml", "core/step_specs/*.json", "prompts/*.yaml", "prompts/**/*.yaml", "prompts/**/*.j2", "prompts/**/*.jinja2", "prompts/**/*.md", "prompts/**/*.txt", "web/*.html", "web/*.txt", "web/assets/*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
"src/novelwb/core/constants.py" = ["UP042"]  # 冻结枚举，保留历史 str/repr 契约

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

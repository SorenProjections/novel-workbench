  - prompt_key: graphR.workflow.audit
    prompt_version: "1.1"
    schema_name: ReviewAuditResult
    path: graphR/workflowAudit
    description: "独立审核当前暂存稿并生成可执行修改意见"

  - prompt_key: graphR.workflow.revise
    prompt_version: "1.0"
    schema_name: ReviewRevisionResult
    path: graphR/workflowRevise
    description: "依据审核意见定向修订当前暂存稿"

  # ── 图6：回归测试 ──────────────────────────────────────────

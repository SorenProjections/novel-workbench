  - prompt_key: graphE.commit
    prompt_version: "2.0"
    schema_name: CommitReceipt
    path: graphE/commit
    description: "事件原子提交"

  # ── 图P：章节许可 ──────────────────────────────────────────
  - prompt_key: graphP.chapterLicense
    prompt_version: "2.0"
    schema_name: ChapterSpec
    path: graphP/chapterLicense
    description: "CHAPTER_LICENSE"

  # ── 图5：章后置 ────────────────────────────────────────────
  - prompt_key: graph5.chapterizeCut
    prompt_version: "3.0"

    schema_name: FatigueReport
    path: graph5/fatigue
    description: "章节化疲劳报告"

  - prompt_key: graph5.chapterCommit
    prompt_version: "2.0"
    schema_name: CommitReceipt
    path: graph5/chapterCommit
    description: "CHAPTER_COMMIT"


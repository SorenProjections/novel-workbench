step_key: graph2.story.room
graph: "2"
schema_version: v1
description: "全书故事室深化（总纲/故事线/角色成长/物品/大场面/资产生命周期）"
input_schema: CreateRunRequest
output_schema: AuthObject
commit_type: auth_patch
is_key_artifact: true

llm:
  prompt_key: graph2.storyRoom
  best_of_n: 2
  offline: true
  model: deepseek-v4-pro
  thinking: enabled
  reasoning_effort: max
  response_format: json_object
  max_tokens: 14000
  temperature: 0.75

hardlint:
  profile: key_artifact
  enabled_rule_groups: [A, B, D, E]

regression:
  required_on_key_artifact: true
  profiles: [style, mechanism]

rag:
  enabled: false

budget:
  max_new_entities: 8
  max_new_terms: 8
  max_explanation_density: 0.2

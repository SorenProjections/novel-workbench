hardlint:
  profile: event_commit
  enabled_rule_groups: [A, B, G]

regression:
  required_on_key_artifact: false
  profiles: [mechanism, event_boundary]

rag:
  enabled: false

budget:
  max_new_entities: 3
  max_new_terms: 5
  max_explanation_density: 0.2

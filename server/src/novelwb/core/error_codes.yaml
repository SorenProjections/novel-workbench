# 错误码注册表 — 冻结枚举，只追加，不删改，不重编号
# 格式: code: {http_status, message, retryable}

errors:

  # ── 通用 1xxx ──────────────────────────────────────────────
  E1000:
    http_status: 400
    message: "请求参数无效"
    retryable: false

  E1001:
